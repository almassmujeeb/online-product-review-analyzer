<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Search Product Reviews</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#eef7ff,#f8fbff);
}

.search-box{

width:550px;
background:#fff;
padding:40px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
text-align:center;

}

.icon{

width:100px;
height:100px;
background:#eaf8ee;
border-radius:50%;
margin:auto;
display:flex;
justify-content:center;
align-items:center;
font-size:45px;
color:#0b8b2f;

}

h1{

margin-top:25px;
font-weight:bold;
color:#143a2b;

}

p{

color:#666;
margin-top:10px;
margin-bottom:30px;

}

.input-group{

margin-bottom:20px;

}

.input-group-text{

background:white;
border-right:none;

}

.form-control{

height:55px;
border-left:none;

}

.form-control:focus{

box-shadow:none;

}

.btn-search{

height:55px;
font-size:20px;
font-weight:bold;
background:#0b8b2f;
border:none;

}

.btn-search:hover{

background:#087324;

}

hr{

margin:30px 0;

}

.back{

text-decoration:none;
font-size:18px;
font-weight:bold;

}

</style>

</head>

<body>

<div class="search-box">

<div class="icon">
<i class="fa-solid fa-magnifying-glass"></i>
</div>

<h1>Search Product Reviews</h1>

<p>
Enter a product name and analyze reviews from multiple platforms
to make better buying decisions.
</p>

<form action="/search_review" method="POST">

<div class="input-group">

<span class="input-group-text">
<i class="fa-solid fa-magnifying-glass"></i>
</span>

<input
type="text"
name="product"
class="form-control"
placeholder="Enter Product Name"
required>

</div>

<button class="btn btn-success btn-search w-100">

<i class="fa-solid fa-magnifying-glass"></i>

&nbsp;

Analyze Reviews

</button>

</form>

<hr>

<a href="/dashboard" class="back">

<i class="fa-solid fa-arrow-left"></i>

Back to Dashboard

</a>

</div>

</body>
</html>
