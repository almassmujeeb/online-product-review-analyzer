<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#eef3ff;
}

.container{
width:900px;
height:560px;
display:flex;
background:#fff;
border-radius:15px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.left{
width:50%;
background:linear-gradient(180deg,#d9e6ff,#8cb4ff);
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

.left img{
width:90%;
}

.right{
width:50%;
display:flex;
justify-content:center;
align-items:center;
}

.form-box{
width:80%;
}

.icon{
width:70px;
height:70px;
background:#2962ff;
border-radius:50%;
margin:auto;
display:flex;
justify-content:center;
align-items:center;
color:white;
font-size:30px;
}

h2{
text-align:center;
margin-top:20px;
}

p{
text-align:center;
color:gray;
margin-bottom:30px;
}

.input-group{
position:relative;
margin-bottom:20px;
}

.input-group i{
position:absolute;
left:15px;
top:50%;
transform:translateY(-50%);
color:#777;
}

.input-group input{
width:100%;
padding:14px 45px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

.eye{
position:absolute;
right:15px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
}

.row{
display:flex;
justify-content:space-between;
margin-bottom:25px;
font-size:14px;
}

.row a{
text-decoration:none;
color:#2962ff;
}

button{
width:100%;
padding:14px;
background:#2962ff;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#0039cb;
}

</style>

</head>

<body>

<div class="container">

<div class="left">
    <img src="{{ url_for('static', filename='images/login.png') }}" alt="Login Image">
</div>

<div class="right">

<div class="form-box">

<div class="icon">

<i class="fa-regular fa-user"></i>

</div>

<h2>Welcome Back!</h2>

<p>Login to your account</p>

<form method="POST">

<div class="input-group">

<i class="fa-regular fa-user"></i>

<input
type="text"
name="username"
placeholder="Username"
required>

</div>

<div class="input-group">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
name="password"
placeholder="Password"
required>

<i
class="fa-solid fa-eye eye"
onclick="showPassword()"></i>

</div>

<div class="row">

<label>

<input type="checkbox">

Remember me

</label>

<a href="#">

Forgot Password?

</a>

</div>

<button type="submit">

Login

</button>

</form>

</div>

</div>

</div>

<script>

function showPassword(){

var x=document.getElementById("password");

if(x.type==="password")
x.type="text";
else
x.type="password";

}

</script>

</body>
</html>
